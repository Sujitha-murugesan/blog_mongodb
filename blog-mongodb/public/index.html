<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home | BlogApp</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
  <header id="navbar"></header>
  <main class="container">
    <section class="hero">
      <h1>Share your stories with the world</h1>
      <p>A simple place to read, write and publish blogs. Join the community today.</p>
      <a class="btn" id="heroCta" href="register.html">Get started</a>
    </section>
    <div class="toolbar">
      <h2>Latest posts</h2>
      <div class="filters">
        <select id="category" aria-label="Filter by category">
          <option value="">All categories</option><option>General</option><option>HTML</option>
          <option>CSS</option><option>JavaScript</option><option>Career</option><option>Lifestyle</option>
        </select>
        <input type="search" id="search" placeholder="Search blogs…" aria-label="Search blogs" />
      </div>
    </div>
    <div class="blog-grid" id="blogGrid"></div>
    <div class="pagination" id="pagination"></div>
  </main>
  <footer id="footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
