<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard | BlogApp</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="dashboard">
  <header id="navbar"></header>
  <main class="container">
    <div class="toolbar">
      <div><h1 id="welcome">Dashboard</h1><p class="subtitle">Here's an overview of your blogging activity.</p></div>
      <a class="btn" href="create-blog.html">+ New blog</a>
    </div>
    <section class="stats">
      <div class="card stat"><div class="num" id="statPosts">0</div><div class="label">Total posts</div></div>
      <div class="card stat"><div class="num" id="statWords">0</div><div class="label">Words written</div></div>
      <div class="card stat"><div class="num" id="statLatest">—</div><div class="label">Latest post</div></div>
    </section>
    <h2 style="margin-bottom:14px">Your posts</h2>
    <div class="post-list" id="myPosts"></div>
  </main>
  <footer id="footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
